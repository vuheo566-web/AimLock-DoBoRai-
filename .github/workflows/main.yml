name: Build HeadLock Ob55

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: HeadLock Ob55 APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false
          packages: "platform-tools"

      - name: Install Android packages
        run: |
          sdkmanager \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Locate Android project
        shell: bash
        run: |
          set -e

          if [ -f "settings.gradle" ] || [ -f "settings.gradle.kts" ]; then
            echo "PROJECT=." >> "$GITHUB_ENV"
            exit 0
          fi

          ZIP=$(find . -maxdepth 1 -type f -iname "*.zip" | head -1)

          if [ -z "$ZIP" ]; then
            echo "::error::Không tìm thấy project Android hoặc file ZIP."
            find . -maxdepth 3 -type f | sort
            exit 1
          fi

          mkdir -p extracted
          unzip -o "$ZIP" -d extracted

          SETTINGS=$(find extracted -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            | head -1)

          if [ -z "$SETTINGS" ]; then
            echo "::error::ZIP không chứa settings.gradle."
            find extracted -type f | sort
            exit 1
          fi

          PROJECT=$(dirname "$SETTINGS")

          echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"
          echo "Android project: $PROJECT"

      - name: Verify project
        shell: bash
        run: |
          set -e
          cd "$PROJECT"

          echo "=== PROJECT ==="
          pwd

          if [ ! -d "app" ]; then
            echo "::error::Không tìm thấy thư mục app."
            exit 1
          fi

          if [ ! -f "settings.gradle" ] &&
             [ ! -f "settings.gradle.kts" ]; then
            echo "::error::Không tìm thấy settings.gradle."
            exit 1
          fi

          echo "Project OK"

      - name: Build HeadLock Ob55
        shell: bash
        run: |
          cd "$PROJECT"
          gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Find APK
        shell: bash
        run: |
          APK=$(find "$PROJECT" -type f -name "*.apk" | head -1)

          if [ -z "$APK" ]; then
            echo "::error::Build không tạo APK."
            exit 1
          fi

          cp "$APK" "$GITHUB_WORKSPACE/HeadLock-Ob55.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HeadLock-Ob55
          path: HeadLock-Ob55.apk
          if-no-files-found: error
